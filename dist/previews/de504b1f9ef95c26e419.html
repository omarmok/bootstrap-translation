<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html{color-scheme:light}body.embed-example{padding:1rem;margin:0}body.embed-example .placeholder-img{font-size:1.125rem;text-anchor:middle}body.embed-example svg{max-width:100%}body.embed-example [class^="bd-example-row"] .row>*{padding-top:.75rem;padding-bottom:.75rem;background:#f0e5ff;border:1px solid #b6a0d1}body.embed-example .modal.position-static,body.embed-example .offcanvas.position-static{display:block}body.embed-example [class*="scrollspy-example"]{position:relative;height:13rem;overflow:auto}body.embed-example .bd-example-offcanvas .offcanvas{position:static;display:block;height:15rem;visibility:visible;transform:none}</style><title>Bootstrap Example</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous"></head><body class="embed-example"><div class="bd-example"><button class="form-control form-control-sm combobox-toggle" type="button" data-bs-toggle="combobox" data-bs-placeholder="Small select…">

</button>

</div>

<button class="form-control form-control-lg combobox-toggle" type="button" data-bs-toggle="combobox" data-bs-placeholder="Large select…">
  <span class="combobox-value">Large select…</span>
  <svg class="combobox-caret" width="10" height="16" viewBox="0 0 10 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0.46967 5.46967C0.762563 5.17678 1.23744 5.17678 1.53033 5.46967L5 8.93934L8.46967 5.46967C8.76256 5.17678 9.23744 5.17678 9.53033 5.46967C9.82322 5.76256 9.82322 6.23744 9.53033 6.53033L5.53033 10.5303C5.23744 10.8232 4.76256 10.8232 4.46967 10.5303L0.46967 6.53033C0.176777 6.23744 0.176777 5.76256 0.46967 5.46967Z" fill="currentcolor"></path></svg>
</button>
<div class="menu">
  <button class="menu-item" type="button" data-bs-value="1">Option one</button>
  <button class="menu-item" type="button" data-bs-value="2">Option two</button>
</div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script><script>document.addEventListener('DOMContentLoaded',()=>{
  if (window.bootstrap?.Tooltip) {
    document.querySelectorAll('[data-bs-toggle="tooltip"],[data-toggle="tooltip"]').forEach(el=>new bootstrap.Tooltip(el,{container:'body'}));
    document.querySelectorAll('[data-bs-toggle="popover"],[data-toggle="popover"]').forEach(el=>new bootstrap.Popover(el,{container:'body'}));
    document.querySelectorAll('[data-bs-spy="scroll"]').forEach(el=>bootstrap.ScrollSpy?.getOrCreateInstance?.(el));
    document.querySelectorAll('[data-bs-toggle="toast"], #liveToastBtn').forEach(el=>el.addEventListener('click',()=>{
      const selector=el.dataset.bsTarget||'#liveToast'; const toast=document.querySelector(selector); if(toast) bootstrap.Toast.getOrCreateInstance(toast).show();
    }));
  } else if (window.jQuery) {
    jQuery('[data-toggle="tooltip"]').tooltip?.({container:'body'});
    jQuery('[data-toggle="popover"]').popover?.({container:'body'});
  }
  document.querySelectorAll('#liveAlertBtn').forEach(button=>button.addEventListener('click',()=>{
    const placeholder=document.querySelector('#liveAlertPlaceholder');if(!placeholder)return;
    const alert=document.createElement('div');alert.className='alert alert-success alert-dismissible';alert.setAttribute('role','alert');
    alert.textContent='Nice, you triggered this alert message!';
    const close=document.createElement('button');close.type='button';close.className='btn-close';close.dataset.bsDismiss='alert';close.setAttribute('aria-label','Close');alert.append(close);placeholder.append(alert);
  }));
  document.querySelectorAll('.toast.show').forEach(el=>el.querySelector('[data-bs-dismiss="toast"]')?.addEventListener('click',()=>el.classList.remove('show')));
});</script></body></html>
