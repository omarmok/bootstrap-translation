<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html{color-scheme:light}body.embed-example{padding:1rem;margin:0}body.embed-example .placeholder-img{font-size:1.125rem;text-anchor:middle}body.embed-example svg{max-width:100%}body.embed-example [class^="bd-example-row"] .row>*{padding-top:.75rem;padding-bottom:.75rem;background:#f0e5ff;border:1px solid #b6a0d1}body.embed-example .modal.position-static,body.embed-example .offcanvas.position-static{display:block}body.embed-example [class*="scrollspy-example"]{position:relative;height:13rem;overflow:auto}body.embed-example .bd-example-offcanvas .offcanvas{position:static;display:block;height:15rem;visibility:visible;transform:none}</style><title>Bootstrap Example</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous"></head><body class="embed-example"><div class="bd-example d-flex flex-column gap-2"><div class="form-field">
  <input type="radio" id="radioprimary" class="radio theme-primary" checked="">
  <label for="radioprimary">Example primary radio</label>
</div>
<div class="form-field">
  <input type="radio" id="radioaccent" class="radio theme-accent" checked="">
  <label for="radioaccent">Example accent radio</label>
</div>
<div class="form-field">
  <input type="radio" id="radiosuccess" class="radio theme-success" checked="">
  <label for="radiosuccess">Example success radio</label>
</div>
<div class="form-field">
  <input type="radio" id="radiodanger" class="radio theme-danger" checked="">
  <label for="radiodanger">Example danger radio</label>
</div>
<div class="form-field">
  <input type="radio" id="radiowarning" class="radio theme-warning" checked="">
  <label for="radiowarning">Example warning radio</label>
</div>
<div class="form-field">
  <input type="radio" id="radioinfo" class="radio theme-info" checked="">
  <label for="radioinfo">Example info radio</label>
</div>
<div class="form-field">
  <input type="radio" id="radioinverse" class="radio theme-inverse" checked="">
  <label for="radioinverse">Example inverse radio</label>
</div>
<div class="form-field">
  <input type="radio" id="radiosecondary" class="radio theme-secondary" checked="">
  <label for="radiosecondary">Example secondary radio</label>
</div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script><script>document.addEventListener('DOMContentLoaded',()=>{
  if (window.bootstrap?.Tooltip) {
    document.querySelectorAll('[data-bs-toggle="tooltip"],[data-toggle="tooltip"]').forEach(el=>new bootstrap.Tooltip(el,{container:'body'}));
    document.querySelectorAll('[data-bs-toggle="popover"],[data-toggle="popover"]').forEach(el=>new bootstrap.Popover(el,{container:'body'}));
    document.querySelectorAll('[data-bs-spy="scroll"]').forEach(el=>bootstrap.ScrollSpy?.getOrCreateInstance?.(el));
    document.querySelectorAll('[data-bs-toggle="toast"], #liveToastBtn').forEach(el=>el.addEventListener('click',()=>{
      const selector=el.dataset.bsTarget||'#liveToast'; const toast=document.querySelector(selector); if(toast) bootstrap.Toast.getOrCreateInstance(toast).show();
    }));
  } else if (window.jQuery) {
    jQuery('[data-toggle="tooltip"]').tooltip?.({container:'body'});
    jQuery('[data-toggle="popover"]').popover?.({container:'body'});
  }
  document.querySelectorAll('#liveAlertBtn').forEach(button=>button.addEventListener('click',()=>{
    const placeholder=document.querySelector('#liveAlertPlaceholder');if(!placeholder)return;
    const alert=document.createElement('div');alert.className='alert alert-success alert-dismissible';alert.setAttribute('role','alert');
    alert.textContent='Nice, you triggered this alert message!';
    const close=document.createElement('button');close.type='button';close.className='btn-close';close.dataset.bsDismiss='alert';close.setAttribute('aria-label','Close');alert.append(close);placeholder.append(alert);
  }));
  document.querySelectorAll('.toast.show').forEach(el=>el.querySelector('[data-bs-dismiss="toast"]')?.addEventListener('click',()=>el.classList.remove('show')));
});</script></body></html>
