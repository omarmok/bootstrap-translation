<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html{color-scheme:light}body.embed-example{padding:1rem;margin:0}body.embed-example .placeholder-img{font-size:1.125rem;text-anchor:middle}body.embed-example svg{max-width:100%}body.embed-example [class^="bd-example-row"] .row>*{padding-top:.75rem;padding-bottom:.75rem;background:#f0e5ff;border:1px solid #b6a0d1}body.embed-example .modal.position-static,body.embed-example .offcanvas.position-static{display:block}body.embed-example [class*="scrollspy-example"]{position:relative;height:13rem;overflow:auto}body.embed-example .bd-example-offcanvas .offcanvas{position:static;display:block;height:15rem;visibility:visible;transform:none}</style><base href="https://getbootstrap.com/1.3.0/examples/container-app.html"><title>Page name Supporting text or tagline</title><link rel="stylesheet" href="https://getbootstrap.com/1.3.0/assets/css/bootstrap.css"><style type="text/css">
      /* Override some defaults */
      html, body {
        background-color: #eee;
      }
      body {
        padding-top: 40px; /* 40px to make the container go all the way to the bottom of the topbar */
      }
      .container > footer p {
        text-align: center; /* center align it with the container */
      }
      .container {
        width: 820px; /* downsize our container to make the content feel a bit tighter and more cohesive. NOTE: this removes two full columns from the grid, meaning you only go to 14 columns and not 16. */
      }

      /* The white background content wrapper */
      .content {
        background-color: #fff;
        padding: 20px;
        margin: 0 -20px; /* negative indent the amount of the padding to maintain the grid system */
        -webkit-border-radius: 0 0 6px 6px;
           -moz-border-radius: 0 0 6px 6px;
                border-radius: 0 0 6px 6px;
        -webkit-box-shadow: 0 1px 2px rgba(0,0,0,.15);
           -moz-box-shadow: 0 1px 2px rgba(0,0,0,.15);
                box-shadow: 0 1px 2px rgba(0,0,0,.15);
      }

      /* Page header tweaks */
      .page-header {
        background-color: #f5f5f5;
        padding: 20px 20px 10px;
        margin: -20px -20px 20px;
      }

      /* Styles you shouldn't keep as they are for displaying this base example only */
      .content .span10,
      .content .span4 {
        min-height: 500px;
      }
      /* Give a quick and non-cross-browser friendly divider */
      .content .span4 {
        margin-left: 0;
        padding-left: 19px;
        border-left: 1px solid #eee;
      }

      .topbar .btn {
        border: 0;
      }

    </style></head><body class="">

    <div class="topbar">
      <div class="fill">
        <div class="container">
          <a class="brand" href="#">Project name</a>
          <ul class="nav">
            <li class="active"><a href="#">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
          </ul>
          <form action="" class="pull-right">
            <input class="input-small" type="text" placeholder="Username">
            <input class="input-small" type="password" placeholder="Password">
            <button class="btn" type="submit">Sign in</button>
          </form>
        </div>
      </div>
    </div>

    <div class="container">

      <div class="content">
        <div class="page-header">
          <h1>Page name <small>Supporting text or tagline</small></h1>
        </div>
        <div class="row">
          <div class="span10">
            <h2>Main content</h2>
          </div>
          <div class="span4">
            <h3>Secondary content</h3>
          </div>
        </div>
      </div>

      <footer>
        <p>© Company 2011</p>
      </footer>

    </div> <!-- /container -->

  

<script>document.addEventListener('DOMContentLoaded',()=>{
  if (window.bootstrap?.Tooltip) {
    document.querySelectorAll('[data-bs-toggle="tooltip"],[data-toggle="tooltip"]').forEach(el=>new bootstrap.Tooltip(el,{container:'body'}));
    document.querySelectorAll('[data-bs-toggle="popover"],[data-toggle="popover"]').forEach(el=>new bootstrap.Popover(el,{container:'body'}));
    document.querySelectorAll('[data-bs-spy="scroll"]').forEach(el=>bootstrap.ScrollSpy?.getOrCreateInstance?.(el));
    document.querySelectorAll('[data-bs-toggle="toast"], #liveToastBtn').forEach(el=>el.addEventListener('click',()=>{
      const selector=el.dataset.bsTarget||'#liveToast'; const toast=document.querySelector(selector); if(toast) bootstrap.Toast.getOrCreateInstance(toast).show();
    }));
  } else if (window.jQuery) {
    jQuery('[data-toggle="tooltip"]').tooltip?.({container:'body'});
    jQuery('[data-toggle="popover"]').popover?.({container:'body'});
  }
  document.querySelectorAll('#liveAlertBtn').forEach(button=>button.addEventListener('click',()=>{
    const placeholder=document.querySelector('#liveAlertPlaceholder');if(!placeholder)return;
    const alert=document.createElement('div');alert.className='alert alert-success alert-dismissible';alert.setAttribute('role','alert');
    alert.textContent='Nice, you triggered this alert message!';
    const close=document.createElement('button');close.type='button';close.className='btn-close';close.dataset.bsDismiss='alert';close.setAttribute('aria-label','Close');alert.append(close);placeholder.append(alert);
  }));
  document.querySelectorAll('.toast.show').forEach(el=>el.querySelector('[data-bs-dismiss="toast"]')?.addEventListener('click',()=>el.classList.remove('show')));
});</script></body></html>
