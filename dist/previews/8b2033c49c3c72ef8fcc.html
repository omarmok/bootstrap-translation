<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html{color-scheme:light}body.embed-example{padding:1rem;margin:0}body.embed-example .placeholder-img{font-size:1.125rem;text-anchor:middle}body.embed-example svg{max-width:100%}body.embed-example [class^="bd-example-row"] .row>*{padding-top:.75rem;padding-bottom:.75rem;background:#f0e5ff;border:1px solid #b6a0d1}body.embed-example .modal.position-static,body.embed-example .offcanvas.position-static{display:block}body.embed-example [class*="scrollspy-example"]{position:relative;height:13rem;overflow:auto}body.embed-example .bd-example-offcanvas .offcanvas{position:static;display:block;height:15rem;visibility:visible;transform:none}</style><title>Bootstrap Example</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous"></head><body class="embed-example"><div class="bd-example"><form class="grid grid-cols-1 gap-5">
  <div class="grid gap-5">
    <div class="form-field md:g-col-6">
      <label for="validationServer01" class="form-label">Name</label>
      <input type="text" class="form-control is-valid" id="validationServer01" value="Mark Otto" aria-describedby="validationServer01Valid validationServer01Invalid"><!-- [!code highlight] -->
      <div id="validationServer01Valid" class="valid-feedback">Looks great!</div><!-- [!code highlight] -->
      <div id="validationServer01Invalid" class="invalid-feedback">Full name is required</div><!-- [!code highlight] -->
    </div>
    <div class="form-field md:g-col-6">
      <label for="validationServerDonation" class="form-label">Donation amount</label>
      <div class="input-group">
        <span class="input-group-text" id="inputGroupPrepend3">$</span>
        <input type="number" class="form-control is-invalid" value="" id="validationServerDonation" aria-describedby="inputGroupPrepend3 serverDonateFeedbackValid serverDonateFeedbackInvalid"><!-- [!code highlight] -->
      </div>
      <div id="serverDonateFeedbackValid" class="valid-feedback">Looks great!</div><!-- [!code highlight] -->
      <div id="serverDonateFeedbackInvalid" class="invalid-feedback">Please enter a donation amount</div><!-- [!code highlight] -->
    </div>
  </div>

  <div class="form-field">
    <label for="validationServerAddress" class="form-label">Address</label>
    <input type="text" class="form-control is-valid" id="validationServerAddress" value="1234 Main St" aria-describedby="validationServerAddressValid validationServerAddressInvalid"><!-- [!code highlight] -->
    <div id="validationServerAddressValid" class="valid-feedback">Looks great!</div><!-- [!code highlight] -->
    <div id="validationServerAddressInvalid" class="invalid-feedback">Please enter a mailing address</div>
  </div>

  <div class="grid gap-5">
    <div class="form-field md:g-col-6">
      <label for="validationServer03" class="form-label">City</label>
      <input type="text" class="form-control is-invalid" id="validationServer03" aria-describedby="validationServer03Feedback"><!-- [!code highlight] -->
      <div id="validationServer03Feedback" class="invalid-feedback">Please provide a city</div>
    </div>
    <div class="form-field md:g-col-4">
      <label for="validationServer04" class="form-label">State</label>
      <select class="form-control is-invalid" id="validationServer04" aria-describedby="validationServer04Feedback"><!-- [!code highlight] -->
        <option selected="" disabled="" value="">Choose…</option>
        <option>...</option>
      </select>
      <div id="validationServer04Feedback" class="invalid-feedback">Please select a state</div>
    </div>
    <div class="form-field md:g-col-2">
      <label for="validationServer05" class="form-label">Zip</label>
      <input type="text" class="form-control is-invalid" id="validationServer05" aria-describedby="validationServer05Feedback"><!-- [!code highlight] -->
      <div id="validationServer05Feedback" class="invalid-feedback">Required</div>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">Shipping method</label>
    <div class="form-field mb-1">
      <input type="radio" id="validationServerRadio1" class="radio is-invalid" name="shippingServer"><!-- [!code highlight] -->
      <div class="form-field-content">
        <label for="validationServerRadio1">Standard</label>
        <small class="form-text">Arrives in 5-7 business days.</small>
      </div>
    </div>
    <div class="form-field">
      <input type="radio" id="validationServerRadio2" class="radio is-invalid" name="shippingServer"><!-- [!code highlight] -->
      <div class="form-field-content">
        <label for="validationServerRadio2">Express</label>
        <small class="form-text">Arrives in 2-3 business days.</small>
      </div>
    </div>
  </div>

  <div class="form-field">
    <div class="switch">
      <input type="checkbox" id="validationServerSwitch" role="switch" switch="">
    </div>
    <label for="validationServerSwitch">Subscribe to newsletter</label>
  </div>

  <button class="btn-solid theme-primary justify-self-start" type="submit">Submit form</button>
</form></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script><script>document.addEventListener('DOMContentLoaded',()=>{
  if (window.bootstrap?.Tooltip) {
    document.querySelectorAll('[data-bs-toggle="tooltip"],[data-toggle="tooltip"]').forEach(el=>new bootstrap.Tooltip(el,{container:'body'}));
    document.querySelectorAll('[data-bs-toggle="popover"],[data-toggle="popover"]').forEach(el=>new bootstrap.Popover(el,{container:'body'}));
    document.querySelectorAll('[data-bs-spy="scroll"]').forEach(el=>bootstrap.ScrollSpy?.getOrCreateInstance?.(el));
    document.querySelectorAll('[data-bs-toggle="toast"], #liveToastBtn').forEach(el=>el.addEventListener('click',()=>{
      const selector=el.dataset.bsTarget||'#liveToast'; const toast=document.querySelector(selector); if(toast) bootstrap.Toast.getOrCreateInstance(toast).show();
    }));
  } else if (window.jQuery) {
    jQuery('[data-toggle="tooltip"]').tooltip?.({container:'body'});
    jQuery('[data-toggle="popover"]').popover?.({container:'body'});
  }
  document.querySelectorAll('#liveAlertBtn').forEach(button=>button.addEventListener('click',()=>{
    const placeholder=document.querySelector('#liveAlertPlaceholder');if(!placeholder)return;
    const alert=document.createElement('div');alert.className='alert alert-success alert-dismissible';alert.setAttribute('role','alert');
    alert.textContent='Nice, you triggered this alert message!';
    const close=document.createElement('button');close.type='button';close.className='btn-close';close.dataset.bsDismiss='alert';close.setAttribute('aria-label','Close');alert.append(close);placeholder.append(alert);
  }));
  document.querySelectorAll('.toast.show').forEach(el=>el.querySelector('[data-bs-dismiss="toast"]')?.addEventListener('click',()=>el.classList.remove('show')));
});</script></body></html>
